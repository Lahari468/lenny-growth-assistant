[project]
name = "lenny-growth-assistant-backend"
version = "0.1.0"
description = "Backend for The Lenny Growth Assistant conversational AI system"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "..", "backend"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

